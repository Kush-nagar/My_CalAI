name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build offline food packs (USDA Branded, Open Food Facts)
        # Large public datasets are fetched at deploy time instead of being committed.
        # If a source is unreachable the app still deploys, just without that pack.
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/packs/build-packs.mjs "$RUNNER_TEMP/packs"
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
